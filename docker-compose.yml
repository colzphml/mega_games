x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      # A Raspberry Pi is not a dedicated broker host: without these
      # flags Redpanda reserves memory and pins cores as if it were.
      - --overprovisioned
      - --smp=1
      - --memory=256M
      - --reserve-memory=0M
      - --default-log-level=warn
    environment:
      TZ: ${TZ}
    mem_limit: 700m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
    labels:
      - autoheal=true
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - megagames-net

  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    restart: on-failure
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      TZ: ${TZ}
    env_file:
      - .env
    mem_limit: 64m
    logging: *default-logging
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -eu
        for topic in "$$KAFKA_INPUT_TOPIC" "$$KAFKA_WEEK_TOPIC" "$$KAFKA_GAME_TOPIC" "$$KAFKA_TELEGRAM_WEEK_TOPIC" "$$KAFKA_GAME_IMAGE_TOPIC"; do
          if [ -z "$$topic" ]; then
            echo "empty topic name in configuration" >&2
            exit 1
          fi
          rpk topic create "$$topic" \
            --brokers "$$KAFKA_BROKERS" \
            --partitions "$$KAFKA_PARTITIONS" \
            --replicas "$$KAFKA_REPLICATION_FACTOR" \
            || rpk topic describe "$$topic" --brokers "$$KAFKA_BROKERS" >/dev/null
        done
        echo "topics ready"
    networks:
      - megagames-net

  discord-kafka-listener:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-colzphml/mega_games}/discord-kafka-listener:${TAG:?TAG is required, e.g. TAG=5.0.0}
    build:
      context: .
      dockerfile: discord_kafka_listener/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    user: "${DISCORD_LISTENER_USER:-0:0}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    mem_limit: 64m
    logging: *default-logging
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - autoheal=true
    volumes:
      - listener-state:/var/lib/discord-listener
    networks:
      - megagames-net

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    mem_limit: 256m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 5s
    labels:
      - autoheal=true
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - megagames-net

  minio:
    # Pinned, but not for the usual drift reason alone. minio/minio was
    # archived by its owner on 2026-04-25 and no further community
    # images are published, so :latest was never going to move again -
    # it already resolved to this exact release (verified by digest,
    # both `docker pull`ed: sha256:14cea493d9a34af32f524e538b8346cf79
    # f3321eff8e708c1e2960462bd8936e). Pinning here just makes that
    # explicit and stops relying on a tag nobody maintains anymore.
    # There will be no more security patches under this tag either -
    # the project has no fixed-release alternative to move to; that's
    # a decision for whoever owns the next deploy, not this pin.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ}
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    mem_limit: 256m
    logging: *default-logging
    ports:
      - "${MINIO_EXPOSE_PORT:-9000}:9000"   # game-image links used directly by the dashboard
    healthcheck:
      # No wget in this image, unlike the Go services' health endpoints.
      # `mc ready local` is MinIO's own documented healthcheck for this
      # exact setup: it ships in the image, and "local" needs no prior
      # `mc alias set` - it always means the server mc is running in.
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s
    labels:
      - autoheal=true
    volumes:
      - minio-data:/data
    networks:
      - megagames-net

  discord-kafka-processor:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-colzphml/mega_games}/discord-kafka-processor:${TAG:?TAG is required, e.g. TAG=5.0.0}
    build:
      context: .
      dockerfile: discord_kafka_processor/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    mem_limit: 64m
    logging: *default-logging
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 30s
    labels:
      - autoheal=true
    networks:
      - megagames-net

  discord-kafka-week-formatter:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-colzphml/mega_games}/discord-kafka-week-formatter:${TAG:?TAG is required, e.g. TAG=5.0.0}
    build:
      context: .
      dockerfile: discord_kafka_week_formatter/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    mem_limit: 64m
    logging: *default-logging
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - autoheal=true
    networks:
      - megagames-net

  discord-kafka-game-image:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-colzphml/mega_games}/discord-kafka-game-image:${TAG:?TAG is required, e.g. TAG=5.0.0}
    build:
      context: .
      dockerfile: discord_kafka_game_image/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    mem_limit: 512m
    logging: *default-logging
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - autoheal=true
    networks:
      - megagames-net

  discord-kafka-telegram-week-sender:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-colzphml/mega_games}/discord-kafka-telegram-week-sender:${TAG:?TAG is required, e.g. TAG=5.0.0}
    build:
      context: .
      dockerfile: discord_kafka_telegram_week_sender/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    mem_limit: 64m
    logging: *default-logging
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - autoheal=true
    networks:
      - megagames-net

  discord-kafka-telegram-game-sender:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-colzphml/mega_games}/discord-kafka-telegram-game-sender:${TAG:?TAG is required, e.g. TAG=5.0.0}
    build:
      context: .
      dockerfile: discord_kafka_telegram_game_sender/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    mem_limit: 64m
    logging: *default-logging
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - autoheal=true
    networks:
      - megagames-net

  admin-panel:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-colzphml/mega_games}/admin-panel:${TAG:?TAG is required, e.g. TAG=5.0.0}
    build:
      context: .
      dockerfile: Dockerfile.admin
    platform: ${TARGET_PLATFORM}
    restart: unless-stopped
    ports:
      - "8002:8081"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      HEALTH_ADDR: ":8081"
      TZ: ${TZ}
    mem_limit: 128m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - autoheal=true
    networks:
      - megagames-net

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_START_PERIOD: 180
    mem_limit: 32m
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - megagames-net

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    profiles:
      - monitoring
    command: -config.file=/etc/loki/config.yaml
    mem_limit: 320m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      - autoheal=true
    volumes:
      - loki-data:/loki
      - ./monitoring/loki-config.yaml:/etc/loki/config.yaml:ro
    networks:
      - megagames-net

  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    profiles:
      - monitoring
    command: -config.file=/etc/promtail/config.yaml
    mem_limit: 192m
    logging: *default-logging
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9080/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      - autoheal=true
    volumes:
      - promtail-data:/var/lib/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yaml:ro
    networks:
      - megagames-net

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "${GRAFANA_EXPOSE_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    mem_limit: 320m
    logging: *default-logging
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    labels:
      - autoheal=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - megagames-net

volumes:
  redpanda-data:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  listener-state:
  postgres-data:
  mongo-data:
  minio-data:
  grafana-data:
  loki-data:
  promtail-data:

networks:
  megagames-net:
    driver: bridge
