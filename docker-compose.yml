services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -ec
      - |
        cat >/tmp/zookeeper.properties <<'EOF'
        dataDir=/var/lib/zookeeper/data
        dataLogDir=/var/lib/zookeeper/log
        clientPort=2181
        tickTime=2000
        initLimit=10
        syncLimit=5
        EOF
        exec zookeeper-server-start /tmp/zookeeper.properties
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/2181"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    labels:
      - autoheal=true
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - megagames-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      TZ: ${TZ}
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/9092"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    labels:
      - autoheal=true
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - megagames-net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TZ: ${TZ}
    env_file:
      - .env
    entrypoint:
      - /bin/bash
      - -c
      - |
        for i in $(seq 1 30); do
          ok=1
          for topic in "$$KAFKA_INPUT_TOPIC" "$$KAFKA_WEEK_TOPIC" "$$KAFKA_GAME_TOPIC" "$$KAFKA_TELEGRAM_WEEK_TOPIC" "$$KAFKA_GAME_IMAGE_TOPIC"; do
            if [ -z "$$topic" ]; then
              ok=0
              continue
            fi
            kafka-topics --bootstrap-server "$$KAFKA_BROKERS" --create --if-not-exists --topic "$$topic" --partitions "$$KAFKA_PARTITIONS" --replication-factor "$$KAFKA_REPLICATION_FACTOR" || ok=0
          done
          if [ "$${ok:-0}" -eq 1 ]; then
            exit 0
          fi
          echo "waiting for kafka..."
          sleep 2
        done
        exit 1
    networks:
      - megagames-net

  discord-kafka-listener:
    image: 192.168.0.61:5000/mega_games/discord-kafka-listener:${TAG:-4.3.0}
    build:
      context: .
      dockerfile: discord_kafka_listener/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    user: "${DISCORD_LISTENER_USER:-0:0}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - autoheal=true
    volumes:
      - listener-state:/var/lib/discord-listener
    networks:
      - megagames-net

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_EXPOSE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    labels:
      - autoheal=true
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - megagames-net

  mongo:
    image: ${MONGO_IMAGE:-mongo:7}
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "${MONGO_EXPOSE_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "bash", "-c", "if command -v mongosh >/dev/null 2>&1; then mongosh --quiet --eval 'db.runCommand({ ping: 1 })'; else mongo --quiet --eval 'db.runCommand({ ping: 1 })'; fi"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    labels:
      - autoheal=true
    volumes:
      - mongo-data:/data/db
    networks:
      - megagames-net

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ}
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_EXPOSE_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - megagames-net

  selenium-chrome:
    image: selenium/standalone-chrome:latest
    restart: unless-stopped
    profiles:
      - selenium
    shm_size: 2gb
    volumes:
      - selenium-downloads:/home/seluser/Downloads
    networks:
      - megagames-net

  discord-kafka-processor:
    image: 192.168.0.61:5000/mega_games/discord-kafka-processor:${TAG:-4.3.0}
    build:
      context: .
      dockerfile: discord_kafka_processor/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - autoheal=true
    networks:
      - megagames-net

  discord-kafka-week-formatter:
    image: 192.168.0.61:5000/mega_games/discord-kafka-week-formatter:${TAG:-4.3.0}
    build:
      context: .
      dockerfile: discord_kafka_week_formatter/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - autoheal=true
    networks:
      - megagames-net

  discord-kafka-game-image:
    image: 192.168.0.61:5000/mega_games/discord-kafka-game-image:${TAG:-4.3.0}
    build:
      context: .
      dockerfile: discord_kafka_game_image/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - autoheal=true
    volumes:
      - selenium-downloads:/home/seluser/Downloads
    networks:
      - megagames-net

  discord-kafka-telegram-week-sender:
    image: 192.168.0.61:5000/mega_games/discord-kafka-telegram-week-sender:${TAG:-4.3.0}
    build:
      context: .
      dockerfile: discord_kafka_telegram_week_sender/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - autoheal=true
    networks:
      - megagames-net

  discord-kafka-telegram-game-sender:
    image: 192.168.0.61:5000/mega_games/discord-kafka-telegram-game-sender:${TAG:-4.3.0}
    build:
      context: .
      dockerfile: discord_kafka_telegram_game_sender/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - autoheal=true
    networks:
      - megagames-net

  admin-panel:
    image: 192.168.0.61:5000/mega_games/admin-panel:${TAG:-4.3.0}
    build:
      context: .
      dockerfile: Dockerfile.admin
    restart: unless-stopped
    ports:
      - "8002:8081"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      HEALTH_ADDR: ":8081"
      TZ: ${TZ}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - autoheal=true
    networks:
      - megagames-net

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_START_PERIOD: 180
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - megagames-net

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "${LOKI_EXPOSE_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      - autoheal=true
    volumes:
      - loki-data:/loki
      - ./monitoring/loki-config.yaml:/etc/loki/config.yaml:ro
    networks:
      - megagames-net

  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9080/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      - autoheal=true
    volumes:
      - promtail-data:/var/lib/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yaml:ro
    networks:
      - megagames-net

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "${GRAFANA_EXPOSE_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    labels:
      - autoheal=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - megagames-net

volumes:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  listener-state:
  postgres-data:
  mongo-data:
  minio-data:
  grafana-data:
  loki-data:
  promtail-data:
  selenium-downloads:

networks:
  megagames-net:
    driver: bridge
