x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # The image's own default data dir (/tmp/kraft-combined-logs) is
      # not owned by its non-root appuser once a *fresh named volume* is
      # mounted there - Docker creates that mountpoint as root:root, and
      # Kafka then fails to write to it. /var/lib/kafka/data is the path
      # the image pre-creates and chowns to appuser for exactly this
      # (Dockerfile: `VOLUME [... /var/lib/kafka/data ...]`); verified
      # empirically, see task-V5-38-report.md.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Bounds the JVM heap; mem_limit below leaves headroom on top of
      # it for metaspace/off-heap/page cache. Confirmed on the target
      # Pi itself under a 2000-message load test (4x a real week's
      # volume): 254 MB idle, 315 MB while writing, 370 MB after
      # reading back - 72% of the 512m limit below, at peak.
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    mem_limit: 512m
    logging: *default-logging
    healthcheck:
      # Kafka's own recommended liveness probe: a real ApiVersions
      # request/response round-trip, not just a TCP connect. Confirmed
      # empirically to exit non-zero when the broker process is
      # unresponsive (SIGSTOP'd from outside its PID namespace) and 0
      # again once it resumes - see task-V5-38-report.md.
      #
      # Budget, confirmed on the target Pi: startup to first healthy
      # takes 25s, well inside the 60s start_period below - no need to
      # widen that further. But a frozen broker doesn't refuse the
      # connection, it accepts and then never answers, so a failed
      # check hangs for the full `timeout` before Docker kills it: the
      # real cost per attempt is timeout + interval, not interval
      # alone. At the previous retries: 10 that measured 252s
      # (10 * (10+15), almost exactly) to go unhealthy on the Pi - over
      # four minutes of a frozen broker still reporting healthy, with
      # autoheal not intervening and dependents already failing. That
      # retry count was deliberate slack from before the Pi's boot time
      # was known; now that it's measured at 25s, the slack buys
      # nothing but blindness. retries: 5 gives 5 * (10+15) = 125s
      # (~2 minutes) to detect a genuinely dead broker, while still
      # needing five consecutive failures - not one slow check - to
      # flip a healthy broker unhealthy.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - autoheal=true
    volumes:
      - kafka-kraft-data:/var/lib/kafka/data
    networks:
      - megagames-net

  kafka-init:
    image: apache/kafka:3.9.0
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TZ: ${TZ}
    env_file:
      - .env
    mem_limit: 64m
    logging: *default-logging
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -eu
        for topic in "$$KAFKA_INPUT_TOPIC" "$$KAFKA_WEEK_TOPIC" "$$KAFKA_GAME_TOPIC" "$$KAFKA_TELEGRAM_WEEK_TOPIC" "$$KAFKA_GAME_IMAGE_TOPIC"; do
          if [ -z "$$topic" ]; then
            echo "empty topic name in configuration" >&2
            exit 1
          fi
          /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
            --topic "$$topic" \
            --bootstrap-server "$$KAFKA_BROKERS" \
            --partitions "$$KAFKA_PARTITIONS" \
            --replication-factor "$$KAFKA_REPLICATION_FACTOR"
        done
        echo "topics ready"
    networks:
      - megagames-net

  discord-kafka-listener:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-colzphml/mega_games}/discord-kafka-listener:${TAG:?TAG is required, e.g. TAG=5.0.0}
    build:
      context: .
      dockerfile: discord_kafka_listener/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    user: "${DISCORD_LISTENER_USER:-0:0}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    mem_limit: 64m
    logging: *default-logging
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - autoheal=true
    volumes:
      - listener-state:/var/lib/discord-listener
    networks:
      - megagames-net

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    mem_limit: 256m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 5s
    labels:
      - autoheal=true
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - megagames-net

  minio:
    # Pinned, but not for the usual drift reason alone. minio/minio was
    # archived by its owner on 2026-04-25 and no further community
    # images are published, so :latest was never going to move again -
    # it already resolved to this exact release (verified by digest,
    # both `docker pull`ed: sha256:14cea493d9a34af32f524e538b8346cf79
    # f3321eff8e708c1e2960462bd8936e). Pinning here just makes that
    # explicit and stops relying on a tag nobody maintains anymore.
    # There will be no more security patches under this tag either -
    # the project has no fixed-release alternative to move to; that's
    # a decision for whoever owns the next deploy, not this pin.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ}
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    mem_limit: 256m
    logging: *default-logging
    ports:
      - "${MINIO_EXPOSE_PORT:-9000}:9000"   # game-image links used directly by the dashboard
    healthcheck:
      # No wget in this image, unlike the Go services' health endpoints.
      # `mc ready local` is MinIO's own documented healthcheck for this
      # exact setup: it ships in the image, and "local" needs no prior
      # `mc alias set` - it always means the server mc is running in.
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s
    labels:
      - autoheal=true
    volumes:
      - minio-data:/data
    networks:
      - megagames-net

  discord-kafka-processor:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-colzphml/mega_games}/discord-kafka-processor:${TAG:?TAG is required, e.g. TAG=5.0.0}
    build:
      context: .
      dockerfile: discord_kafka_processor/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    mem_limit: 64m
    logging: *default-logging
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 30s
    labels:
      - autoheal=true
    networks:
      - megagames-net

  discord-kafka-week-formatter:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-colzphml/mega_games}/discord-kafka-week-formatter:${TAG:?TAG is required, e.g. TAG=5.0.0}
    build:
      context: .
      dockerfile: discord_kafka_week_formatter/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    mem_limit: 64m
    logging: *default-logging
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - autoheal=true
    networks:
      - megagames-net

  discord-kafka-game-image:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-colzphml/mega_games}/discord-kafka-game-image:${TAG:?TAG is required, e.g. TAG=5.0.0}
    build:
      context: .
      dockerfile: discord_kafka_game_image/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    mem_limit: 512m
    logging: *default-logging
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - autoheal=true
    networks:
      - megagames-net

  discord-kafka-telegram-week-sender:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-colzphml/mega_games}/discord-kafka-telegram-week-sender:${TAG:?TAG is required, e.g. TAG=5.0.0}
    build:
      context: .
      dockerfile: discord_kafka_telegram_week_sender/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    mem_limit: 64m
    logging: *default-logging
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - autoheal=true
    networks:
      - megagames-net

  discord-kafka-telegram-game-sender:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-colzphml/mega_games}/discord-kafka-telegram-game-sender:${TAG:?TAG is required, e.g. TAG=5.0.0}
    build:
      context: .
      dockerfile: discord_kafka_telegram_game_sender/Dockerfile
      args:
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    mem_limit: 64m
    logging: *default-logging
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - autoheal=true
    networks:
      - megagames-net

  admin-panel:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-colzphml/mega_games}/admin-panel:${TAG:?TAG is required, e.g. TAG=5.0.0}
    build:
      context: .
      dockerfile: Dockerfile.admin
    platform: ${TARGET_PLATFORM}
    restart: unless-stopped
    ports:
      - "8002:8081"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      HEALTH_ADDR: ":8081"
      TZ: ${TZ}
    mem_limit: 128m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - autoheal=true
    networks:
      - megagames-net

  autoheal:
    # willfarrell/autoheal has no maintained version tag to pin to:
    # Docker Hub's newest one is 1.2.0 from 2021-07-08, GitHub has no
    # releases at all, and upstream's own docs describe :latest as
    # "built daily" and use it directly in their examples - pinning to
    # 1.2.0 would be a 5-year regression, not a fix. Pinned by digest
    # instead, to still stop unannounced drift: this is what :latest
    # resolved to on 2026-07-31 (verified via `docker pull` and the
    # Docker Hub API). Trade-off: this also freezes out the automatic
    # base-image security patches that daily :latest rebuilds carried -
    # bumping the digest deliberately from now on is the replacement.
    image: willfarrell/autoheal@sha256:cc3687207fbc8e2d296de6b8ecc449ca9dd6845bd4ed988331a3fb73ce2d42c2
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_START_PERIOD: 180
    mem_limit: 32m
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - megagames-net

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    profiles:
      - monitoring
    command: -config.file=/etc/loki/config.yaml
    mem_limit: 320m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      - autoheal=true
    volumes:
      - loki-data:/loki
      - ./monitoring/loki-config.yaml:/etc/loki/config.yaml:ro
    networks:
      - megagames-net

  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    profiles:
      - monitoring
    command: -config.file=/etc/promtail/config.yaml
    mem_limit: 192m
    logging: *default-logging
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9080/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      - autoheal=true
    volumes:
      - promtail-data:/var/lib/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yaml:ro
    networks:
      - megagames-net

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "${GRAFANA_EXPOSE_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    mem_limit: 320m
    logging: *default-logging
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    labels:
      - autoheal=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - megagames-net

volumes:
  kafka-kraft-data:
  # redpanda-data, kafka-data, zookeeper-data, and zookeeper-log are all
  # orphaned (V5-38, V5-23): nothing mounts them anymore. Kept, not
  # reused, not deleted - customer requirement, history is never
  # discarded. See AGENTS.md's forbidden-actions table.
  redpanda-data:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  listener-state:
  postgres-data:
  mongo-data:
  minio-data:
  grafana-data:
  loki-data:
  promtail-data:

networks:
  megagames-net:
    driver: bridge
