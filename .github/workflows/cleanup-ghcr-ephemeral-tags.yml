name: Cleanup GHCR Ephemeral Tags

on:
  push:
    branches:
      - release-*
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old sha-tagged package versions
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          images=(
            admin-panel
            discord-kafka-game-image
            discord-kafka-listener
            discord-kafka-processor
            discord-kafka-telegram-game-sender
            discord-kafka-telegram-week-sender
            discord-kafka-week-formatter
          )

          delete_count=0

          for image in "${images[@]}"; do
            package_name="mega_games/${image}"
            encoded_name="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${package_name}")"

            echo "::group::${package_name}"
            versions_json="$(gh api --paginate "users/${OWNER}/packages/container/${encoded_name}/versions?per_page=100")"

            if [[ "$(jq 'length' <<<"${versions_json}")" -eq 0 ]]; then
              echo "No versions found"
              echo "::endgroup::"
              continue
            fi

            while IFS= read -r version; do
              id="$(jq -r '.id' <<<"${version}")"
              tags_json="$(jq -c '.metadata.container.tags // []' <<<"${version}")"

              has_sha="$(jq 'any(.metadata.container.tags[]?; startswith("sha-"))' <<<"${version}")"
              has_release="$(jq 'any(.metadata.container.tags[]?; test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<<"${version}")"
              has_latest="$(jq 'any(.metadata.container.tags[]?; . == "latest")' <<<"${version}")"

              if [[ "${has_sha}" == "true" && "${has_release}" == "false" && "${has_latest}" == "false" ]]; then
                echo "Deleting version ${id} with tags ${tags_json}"
                gh api -X DELETE "users/${OWNER}/packages/container/${encoded_name}/versions/${id}"
                delete_count=$((delete_count + 1))
              else
                echo "Keeping version ${id} with tags ${tags_json}"
              fi
            done < <(jq -c '.[]' <<<"${versions_json}")

            echo "::endgroup::"
          done

          echo "Deleted ${delete_count} ephemeral package version(s)"
