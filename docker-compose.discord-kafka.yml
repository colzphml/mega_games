services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      TZ: ${TZ}
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - megagames-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      TZ: ${TZ}
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - megagames-net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - kafka
    environment:
      TZ: ${TZ}
    env_file:
      - .env
    entrypoint:
      - /bin/bash
      - -c
      - |
        for i in $(seq 1 30); do
          ok=1
          for topic in "$$KAFKA_INPUT_TOPIC" "$$KAFKA_WEEK_TOPIC" "$$KAFKA_GAME_TOPIC"; do
            if [ -z "$$topic" ]; then
              ok=0
              continue
            fi
            kafka-topics --bootstrap-server "$$KAFKA_BROKERS" --create --if-not-exists --topic "$$topic" --partitions "$$KAFKA_PARTITIONS" --replication-factor "$$KAFKA_REPLICATION_FACTOR" || ok=0
          done
          if [ "$${ok:-0}" -eq 1 ]; then
            exit 0
          fi
          echo "waiting for kafka..."
          sleep 2
        done
        exit 1
    networks:
      - megagames-net

  discord-kafka-listener:
    build:
      context: .
      dockerfile: discord_kafka_listener/Dockerfile
      args:
        VERSION: ${APP_VERSION}
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    depends_on:
      - kafka-init
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - megagames-net

  postgres:
    image: postgres:16.4-alpine
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_EXPOSE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - megagames-net

  discord-kafka-processor:
    build:
      context: .
      dockerfile: discord_kafka_processor/Dockerfile
      args:
        VERSION: ${APP_VERSION}
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    depends_on:
      - kafka-init
      - postgres
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - megagames-net

volumes:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  postgres-data:

networks:
  megagames-net:
    driver: bridge
