services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      TZ: ${TZ}
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - megagames-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      TZ: ${TZ}
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - megagames-net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - kafka
    environment:
      TZ: ${TZ}
    env_file:
      - .env
    entrypoint:
      - /bin/bash
      - -c
      - |
        for i in $(seq 1 30); do
          ok=1
          for topic in "$$KAFKA_INPUT_TOPIC" "$$KAFKA_WEEK_TOPIC" "$$KAFKA_GAME_TOPIC" "$$KAFKA_TELEGRAM_WEEK_TOPIC" "$$KAFKA_GAME_IMAGE_TOPIC"; do
            if [ -z "$$topic" ]; then
              ok=0
              continue
            fi
            kafka-topics --bootstrap-server "$$KAFKA_BROKERS" --create --if-not-exists --topic "$$topic" --partitions "$$KAFKA_PARTITIONS" --replication-factor "$$KAFKA_REPLICATION_FACTOR" || ok=0
          done
          if [ "$${ok:-0}" -eq 1 ]; then
            exit 0
          fi
          echo "waiting for kafka..."
          sleep 2
        done
        exit 1
    networks:
      - megagames-net

  discord-kafka-listener:
    build:
      context: .
      dockerfile: discord_kafka_listener/Dockerfile
      args:
        VERSION: ${APP_VERSION}
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - megagames-net

  postgres:
    image: postgres:16.4-alpine
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_EXPOSE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - megagames-net

  mongo:
    image: mongo:7
    environment:
      TZ: ${TZ}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "${MONGO_EXPOSE_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - mongo-data:/data/db
    networks:
      - megagames-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ}
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_EXPOSE_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - megagames-net

  selenium-chrome:
    image: selenium/standalone-chrome:latest
    profiles:
      - selenium
    shm_size: 2gb
    volumes:
      - selenium-downloads:/home/seluser/Downloads
    networks:
      - megagames-net

  discord-kafka-processor:
    build:
      context: .
      dockerfile: discord_kafka_processor/Dockerfile
      args:
        VERSION: ${APP_VERSION}
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - megagames-net

  discord-kafka-week-formatter:
    build:
      context: .
      dockerfile: discord_kafka_week_formatter/Dockerfile
      args:
        VERSION: ${APP_VERSION}
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - megagames-net

  discord-kafka-game-image:
    build:
      context: .
      dockerfile: discord_kafka_game_image/Dockerfile
      args:
        VERSION: ${APP_VERSION}
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - selenium-downloads:/home/seluser/Downloads
    networks:
      - megagames-net

  discord-kafka-telegram-week-sender:
    build:
      context: .
      dockerfile: discord_kafka_telegram_week_sender/Dockerfile
      args:
        VERSION: ${APP_VERSION}
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - megagames-net

  discord-kafka-telegram-game-sender:
    build:
      context: .
      dockerfile: discord_kafka_telegram_game_sender/Dockerfile
      args:
        VERSION: ${APP_VERSION}
        TZ: ${TZ}
    platform: ${TARGET_PLATFORM}
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - megagames-net

volumes:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  postgres-data:
  mongo-data:
  minio-data:
  selenium-downloads:

networks:
  megagames-net:
    driver: bridge
