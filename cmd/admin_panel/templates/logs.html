{{define "content"}}
<hgroup>
    <h2>Logs & Monitoring</h2>
    <h3>Grafana Dashboard</h3>
</hgroup>
<article style="padding: 0; overflow: hidden; height: 80vh;" id="grafana-container">
    <script>
        const hostname = window.location.hostname;
        const iframe = document.createElement('iframe');
        // Use window.location.protocol to support https if needed, though Grafana is likely http
        iframe.src = `http://${hostname}:3000/d/mega-games-logs/mega-games-logs?orgId=1&refresh=5s&kiosk`;
        iframe.width = "100%";
        iframe.height = "100%";
        iframe.frameBorder = "0";
        document.getElementById('grafana-container').appendChild(iframe);
    </script>
</article>
{{end}}
