{{define "content"}}
<h2>Messages</h2>
<article>
    <header><strong>Unified status</strong> <small>Latest 50 messages across services</small></header>
    {{if .Messages}}
    <figure class="overflow-auto">
    <table role="grid">
        <thead>
            <tr>
                <th scope="col">Message ID</th>
                <th scope="col">Game ID</th>
                <th scope="col">Image</th>
                <th scope="col">Week Info</th>
                <th scope="col">Created At</th>
                <th scope="col">Processor</th>
                <th scope="col">Week Formatter</th>
                <th scope="col">Game Image</th>
                <th scope="col">Telegram Week</th>
                <th scope="col">Telegram Game</th>
                <th scope="col">Errors</th>
                <th scope="col">Drop Reason</th>
            </tr>
        </thead>
        <tbody>
            {{range .Messages}}
            <tr>
                <td style="max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="{{.MessageID}}"><code>{{.MessageID}}</code></td>
                <td>{{.GameID}}</td>
                <td>
                    {{if .ImageURL}}
                    <a href="{{.ImageURL}}" target="_blank" rel="noopener">
                        <img src="{{.ImageURL}}" alt="Game image" style="max-width: 56px; height: auto; display: block;">
                    </a>
                    {{if .Degraded}}<small style="color: #b45309;">fallback</small>{{end}}
                    {{else}}
                    <small style="color: #888;">-</small>
                    {{end}}
                </td>
                <td style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="{{.WeekText}}">{{.WeekText}}</td>
                <td style="white-space: nowrap;"><small>{{.CreatedAt}}</small></td>
                <td>{{.ProcessorStatus}}</td>
                <td>{{.WeekFormatterStatus}}</td>
                <td>{{.GameImageStatus}}</td>
                <td>{{.TelegramWeekStatus}}</td>
                <td>{{.TelegramGameStatus}}</td>
                <td>{{if .Errors}}<span style="color: #b42318; font-weight: 600;" title="{{.Errors}}">Errors</span>{{else}}<small style="color: #888;">-</small>{{end}}</td>
                <td>
                    {{if .DropReason}}
                    <span style="color: #b42318; display: inline-block; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="{{.DropReason}}">{{.DropReason}}</span>
                    {{else}}
                    <small style="color: #888;">-</small>
                    {{end}}
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
    </figure>
    {{else}}
    <p>No messages available.</p>
    {{end}}
</article>
{{end}}
